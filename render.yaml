# Render Blueprint for the Job Portal backend (Spring Boot monolith + PostgreSQL)
# The React frontend is deployed separately on Vercel.
# Database: Neon (external serverless PostgreSQL)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend: Spring Boot monolith (Docker) ──────────────────────────────
  - type: web
    name: jobportal-backend
    runtime: docker
    plan: free
    # Build the Docker image from the monolith module
    rootDir: backned/monolith
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # ── Neon PostgreSQL connection ──────────────────────────────────────
      # Paste your Neon connection string here (from the Neon dashboard).
      # Format: postgresql://user:password@ep-xxx.neon.tech/dbname?sslmode=require
      #
      # The app's DatabaseUrlEnvironmentPostProcessor converts the postgresql://
      # URI to a JDBC URL automatically, extracts username/password from the
      # URI, preserves ?sslmode=require, and drops channel_binding (which the
      # JDBC driver does not support).
      #
      # IMPORTANT: Use Neon's DIRECT connection string, NOT the pooled one
      # (the one ending in "-pooler"). The pooled connection uses PgBouncer in
      # transaction mode, which breaks Hibernate's prepared statements. If you
      # must use the pooled connection, append &prepareThreshold=0 to the URL.
      - key: SPRING_DATASOURCE_URL
        sync: false  # set this manually in the Render dashboard
      # If your Neon connection string already includes user:password in the
      # URI (it usually does), DB_USERNAME and DB_PASSWORD are optional —
      # the post-processor extracts them. Set them only if you prefer to
      # keep credentials separate from the URL.
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ── App configuration ─────────────────────────────────────────────────
      # Comma-separated frontend origins allowed by CORS.
      - key: CORS_ALLOWED_ORIGINS
        value: https://jobportal-theta-one.vercel.app,https://*.vercel.app
      # JWT secret — auto-generated by Render. Do not hardcode.
      - key: JWT_SECRET
        generateValue: true
      # Resend email notifications. Add the rotated key in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: HireTrack <onboarding@resend.dev>
      # Hibernate schema mode: validate in production (no silent schema changes).
      - key: DDL_AUTO
        value: validate
      # HikariCP pool tuning for Neon's serverless PostgreSQL.
      # Neon kills idle connections after ~30s, so keep maxLifetime below that.
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: "25000"
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: "20000"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "20000"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "1"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
