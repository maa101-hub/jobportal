spring.application.name=hiring-tracker

# Single port for the whole application (was 8091/8092/8093/8083 across services)
server.port=8080

# Single shared database (unchanged from the original services)
spring.datasource.url=jdbc:mysql://localhost:3306/HiringApplication
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:window}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
