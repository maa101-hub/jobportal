spring.application.name=hiring-tracker

# Render provides the PORT env var; default to 8080 for local runs
server.port=${PORT:8080}

# PostgreSQL datasource.
# On Render, set SPRING_DATASOURCE_URL / DB_USERNAME / DB_PASSWORD from the
# managed Postgres instance. Locally these fall back to the values below.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/HiringApplication}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
