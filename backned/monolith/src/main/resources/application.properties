spring.application.name=hiring-tracker

# Render provides the PORT env var; default to 8080 for local runs
server.port=${PORT:8080}

# PostgreSQL datasource.
# On Render, set SPRING_DATASOURCE_URL / DB_USERNAME / DB_PASSWORD from the
# managed Postgres instance. Locally these fall back to the values below.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hiringapplication}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:window}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool — tuned for Neon (serverless Postgres).
# Neon kills idle connections after ~30s, so keep maxLifetime/idleTimeout
# below that. Override via env vars for different providers.
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator health endpoint for Render health checks (restrict to health only in prod)
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSE:health}
management.endpoint.health.show-details=never

# JWT configuration — override jwt.secret in production via JWT_SECRET env var.
jwt.secret=${JWT_SECRET:hiretrack-default-secret-change-me-in-production-min-32-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
