# Production profile: every secret and database target must be supplied by the
# deployment environment. Activate with SPRING_PROFILES_ACTIVE=prod.
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production databases should be migrated explicitly; Hibernate must not alter
# the schema on startup.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
